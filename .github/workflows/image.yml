# Reusable container image workflow: build, SBOM, Trivy scan, push to GHCR, cosign sign.
#
# Inputs
#   image-name   Image path without registry. Empty = owner/repo.   default: ""
#   context      Docker build context.                              default: "."
#   file         Dockerfile path.                                   default: "Dockerfile"
#
# Push rule: the image goes to ghcr.io only on a push to main or to a v* tag.
# Pull requests build, write the SBOM and scan. They never push or sign.
# The pushed image is the same local image that Trivy scanned.
#
# Caller permissions (GitHub checks them at start, also on pull requests):
#   contents: read, packages: write, id-token: write
#
# Outputs
#   digest  sha256 digest of the pushed image. Empty when nothing was pushed.
name: image

on:
  workflow_call:
    inputs:
      image-name:
        type: string
        default: ""
      context:
        type: string
        default: "."
      file:
        type: string
        default: "Dockerfile"
    outputs:
      digest:
        description: sha256 digest of the pushed image
        value: ${{ jobs.image.outputs.digest }}

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless signing
    env:
      PUSH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
      SCAN_REF: ci-local/image:scan
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name
        id: name
        env:
          IMAGE_NAME: ${{ inputs.image-name || github.repository }}
        run: echo "image=ghcr.io/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (load into the local Docker daemon)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.SCAN_REF }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: SBOM (syft, SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.SCAN_REF }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json
          dependency-snapshot: false
          upload-release-assets: false

      - name: Trivy scan (fail on critical, NFR-21)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.SCAN_REF }}
          severity: CRITICAL
          exit-code: "1"

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push
        id: push
        if: env.PUSH == 'true'
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          docker push --all-tags "$IMAGE"
          # type=sha,format=long always exists, also when no branch or semver tag applies.
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUSH == 'true'

      - name: Sign (cosign keyless)
        if: env.PUSH == 'true'
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Summary
        if: always()
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Image"
            echo "- Image: \`$IMAGE\`"
            echo "- Pushed: $PUSH"
            echo "- Digest: \`${DIGEST:-none}\`"
            echo "- SBOM: workflow artifact \`sbom.spdx.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
