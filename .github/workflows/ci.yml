# CI for the blueprint repo itself (fleet-standard templates/library/public, stack node).
# Replaces selftest.yml. Four extra jobs test what the fleet stages cannot: the Go and
# Python configs, the shell scripts, actions/deploy and actions/verify-provenance
# (fleet.yml: WF-NAME-02 exception). The reusable workflows next to this file are not
# changed here: their callers pin them by name (@v1).
# PRs and manual runs only (CI-COST-05, CI-COST-19). Required check context: conclusion.
name: ci

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the e2e stage
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - name: Detect code changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        # every: a file counts as code when it matches none of the doc patterns below;
        # code is true when at least one changed file counts. Mixed PRs run every job.
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.github/ISSUE_TEMPLATE/**'

  # Fleet: Biome, actionlint and zizmor on .github/workflows.
  lint:
    needs: changes
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-lint.yml@v0.0.1
    with:
      stack: node

  # The node-only tests: the feature-doc checker and the Biome config. The runner enforces
  # the floor (CI-UNIT-02) and writes coverage/lcov.info for the stage check.
  unit:
    needs: [changes, lint]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-unit.yml@v0.0.1
    with:
      stack: node
      command: >-
        node --test --experimental-test-coverage
        --test-coverage-lines=80 --test-coverage-branches=70
        --test-reporter=spec --test-reporter-destination=stdout
        --test-reporter=lcov --test-reporter-destination=coverage/lcov.info
        tests/feature-doc.test.mjs tests/biome-config.test.mjs

  e2e:
    needs: [changes, unit]
    if: ${{ !failure() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.e2e }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-e2e.yml@v0.0.1
    with:
      stack: node

  # Pack dry run of the published package @synthwerk/biome-config (CI-BUILD-04).
  build:
    needs: [changes, e2e]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-build.yml@v0.0.1
    with:
      stack: node
      command: >-
        pnpm run --if-present build &&
        mkdir -p "$RUNNER_TEMP/pack" &&
        pnpm --dir packages/biome-config pack --pack-destination "$RUNNER_TEMP/pack"

  # The Go and Python config tests (golangci-lint, ruff, mypy), plus actionlint and zizmor
  # on the examples and the composite actions, which the lint stage does not cover.
  toolchains:
    needs: changes
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/fixtures/go/go.mod
          cache: false
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-only: true
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.30"
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Install the dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint the example workflows with actionlint
        run: actionlint examples/workflows/*.yml
      - name: Audit the actions and the examples with zizmor
        run: uvx zizmor@1.30.1 --offline actions examples/workflows/*.yml
      - name: Test the Go and Python configs
        run: node --test tests/go-config.test.mjs tests/python-config.test.mjs

  # Bash syntax check and shellcheck (warning and above) on every tracked shell script.
  shell:
    needs: changes
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the shell syntax with bash -n
        run: git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n
      - name: Run shellcheck at severity warning
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck --severity=warning

  # actions/deploy against a throwaway target on this runner: a local registry,
  # an sshd and a compose project. Proves: the running digest equals the deployed
  # digest, a promote and a rollback swap it, and a wrong or missing digest fails.
  # Nothing leaves the runner: no secret, no environment, no remote host.
  deploy-selftest:
    needs: changes
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the throwaway target
        run: tests/deploy/setup-target.sh

      - name: Deploy A
        uses: $/actions/deploy
        with:
          image: ${{ env.SELFTEST_IMAGE }}
          service: app
          compose-dir: ${{ env.SELFTEST_DIR }}
          host: 127.0.0.1
          port: "2222"
          user: ${{ env.SELFTEST_USER }}
          ssh-key: ${{ env.SELFTEST_KEY }}
          known-hosts: ${{ env.SELFTEST_KNOWN_HOSTS }}
          wait-timeout: "60"
          digest: ${{ env.SELFTEST_DIGEST_A }}
      - name: Check that A runs, outside the action
        env:
          WANT: ${{ env.SELFTEST_IMAGE }}@${{ env.SELFTEST_DIGEST_A }}
        run: tests/deploy/assert-running.sh "$WANT"

      - name: Verify with the wrong digest, which must fail
        id: wrong
        uses: $/actions/deploy
        with:
          image: ${{ env.SELFTEST_IMAGE }}
          service: app
          compose-dir: ${{ env.SELFTEST_DIR }}
          host: 127.0.0.1
          port: "2222"
          user: ${{ env.SELFTEST_USER }}
          ssh-key: ${{ env.SELFTEST_KEY }}
          known-hosts: ${{ env.SELFTEST_KNOWN_HOSTS }}
          wait-timeout: "60"
          digest: ${{ env.SELFTEST_DIGEST_B }}
          verify-only: "true"
        continue-on-error: true

      - name: Deploy a digest that does not exist, which must fail
        id: missing
        uses: $/actions/deploy
        with:
          image: ${{ env.SELFTEST_IMAGE }}
          service: app
          compose-dir: ${{ env.SELFTEST_DIR }}
          host: 127.0.0.1
          port: "2222"
          user: ${{ env.SELFTEST_USER }}
          ssh-key: ${{ env.SELFTEST_KEY }}
          known-hosts: ${{ env.SELFTEST_KNOWN_HOSTS }}
          wait-timeout: "60"
          digest: ${{ env.SELFTEST_MISSING }}
        continue-on-error: true

      - name: Check that A still runs after the failed deploy
        env:
          WANT: ${{ env.SELFTEST_IMAGE }}@${{ env.SELFTEST_DIGEST_A }}
        run: tests/deploy/assert-running.sh "$WANT"

      - name: Promote to B
        uses: $/actions/deploy
        with:
          image: ${{ env.SELFTEST_IMAGE }}
          service: app
          compose-dir: ${{ env.SELFTEST_DIR }}
          host: 127.0.0.1
          port: "2222"
          user: ${{ env.SELFTEST_USER }}
          ssh-key: ${{ env.SELFTEST_KEY }}
          known-hosts: ${{ env.SELFTEST_KNOWN_HOSTS }}
          wait-timeout: "60"
          digest: ${{ env.SELFTEST_DIGEST_B }}
      - name: Check that B runs
        env:
          WANT: ${{ env.SELFTEST_IMAGE }}@${{ env.SELFTEST_DIGEST_B }}
        run: tests/deploy/assert-running.sh "$WANT"

      - name: Roll back to A by digest, with no build
        uses: $/actions/deploy
        with:
          image: ${{ env.SELFTEST_IMAGE }}
          service: app
          compose-dir: ${{ env.SELFTEST_DIR }}
          host: 127.0.0.1
          port: "2222"
          user: ${{ env.SELFTEST_USER }}
          ssh-key: ${{ env.SELFTEST_KEY }}
          known-hosts: ${{ env.SELFTEST_KNOWN_HOSTS }}
          wait-timeout: "60"
          digest: ${{ env.SELFTEST_DIGEST_A }}
      - name: Check that A runs again
        env:
          WANT: ${{ env.SELFTEST_IMAGE }}@${{ env.SELFTEST_DIGEST_A }}
        run: tests/deploy/assert-running.sh "$WANT"

      - name: Check that the failure cases failed
        env:
          WRONG: ${{ steps.wrong.outcome }}
          MISSING: ${{ steps.missing.outcome }}
        run: |
          echo "wrong digest: $WRONG, missing digest: $MISSING"
          [[ "$WRONG" == "failure" && "$MISSING" == "failure" ]]
      - name: Print the sshd log
        if: failure()
        run: sudo cat "$RUNNER_TEMP/deploy-selftest/sshd.log" || true

  # actions/verify-provenance, the gate before a promote or a deploy. This job attests
  # one file itself, then checks: that file with this job's identity passes; a subject
  # without an attestation, a subject not signed by image.yml, and a wrong commit or
  # ref fail.
  provenance:
    needs: changes
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # sign the test attestation
      attestations: write # store and read the test attestation
    env:
      SELF_SIGNER: ${{ github.repository }}/.github/workflows/ci.yml
    steps:
      - name: Make two subjects
        run: |
          head -c 64 /dev/urandom > "$RUNNER_TEMP/built.bin"
          head -c 64 /dev/urandom > "$RUNNER_TEMP/foreign.bin"
          echo "SUBJECT_BUILT=$RUNNER_TEMP/built.bin" >> "$GITHUB_ENV"
          echo "SUBJECT_FOREIGN=$RUNNER_TEMP/foreign.bin" >> "$GITHUB_ENV"
      - name: Attest the built subject
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.SUBJECT_BUILT }}
          show-summary: false

      - name: Verify the built subject with the right signer, ref and commit
        uses: $/actions/verify-provenance
        with:
          subject: ${{ env.SUBJECT_BUILT }}
          repo: ${{ github.repository }}
          signer-workflow: ${{ env.SELF_SIGNER }}
          source-ref: ${{ github.ref }}
          source-commit: ${{ github.sha }}

      - name: Verify a subject not signed by the image workflow, which must fail
        id: signer
        uses: $/actions/verify-provenance
        with:
          subject: ${{ env.SUBJECT_BUILT }}
          repo: ${{ github.repository }}
          source-ref: ${{ github.ref }}
          source-commit: ${{ github.sha }}
        continue-on-error: true

      - name: Verify a subject with no attestation, which must fail
        id: foreign
        uses: $/actions/verify-provenance
        with:
          subject: ${{ env.SUBJECT_FOREIGN }}
          repo: ${{ github.repository }}
          signer-workflow: ${{ env.SELF_SIGNER }}
          source-ref: ${{ github.ref }}
        continue-on-error: true

      - name: Verify with a wrong commit, which must fail
        id: commit
        uses: $/actions/verify-provenance
        with:
          subject: ${{ env.SUBJECT_BUILT }}
          repo: ${{ github.repository }}
          signer-workflow: ${{ env.SELF_SIGNER }}
          source-ref: ${{ github.ref }}
          source-commit: "0000000000000000000000000000000000000000"
        continue-on-error: true

      - name: Verify with a wrong ref, which must fail
        id: ref
        uses: $/actions/verify-provenance
        with:
          subject: ${{ env.SUBJECT_BUILT }}
          repo: ${{ github.repository }}
          signer-workflow: ${{ env.SELF_SIGNER }}
          source-ref: refs/heads/selftest-not-a-branch
        continue-on-error: true

      - name: Check that the failure cases failed
        env:
          SIGNER: ${{ steps.signer.outcome }}
          FOREIGN: ${{ steps.foreign.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
          REF: ${{ steps.ref.outcome }}
        run: |
          echo "signer: $SIGNER, foreign: $FOREIGN, commit: $COMMIT, ref: $REF"
          [[ "$SIGNER" == failure && "$FOREIGN" == failure && "$COMMIT" == failure && "$REF" == failure ]]

  conclusion:
    needs: [changes, lint, unit, e2e, build, toolchains, shell, deploy-selftest, provenance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a job failed or a required stage was skipped
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          LINT: ${{ needs.lint.result }}
          UNIT: ${{ needs.unit.result }}
          BUILD: ${{ needs.build.result }}
          TOOLCHAINS: ${{ needs.toolchains.result }}
          SHELL_LINT: ${{ needs.shell.result }}
          DEPLOY_SELFTEST: ${{ needs.deploy-selftest.result }}
          PROVENANCE: ${{ needs.provenance.result }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a job ended as $r"; exit 1 ;; esac
          done
          if [ "$CODE" = "true" ]; then
            for r in "$LINT" "$UNIT" "$BUILD" "$TOOLCHAINS" "$SHELL_LINT" "$DEPLOY_SELFTEST" "$PROVENANCE"; do
              [ "$r" = "success" ] || { echo "::error::a required stage did not run"; exit 1; }
            done
          fi
