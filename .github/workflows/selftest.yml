# CI for the blueprint repo itself: `just lint` and `just test`.
name: selftest

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/fixtures/go/go.mod
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-only: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.30"
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: pnpm install --frozen-lockfile
      - run: just lint
      - run: just test

  # actions/deploy against a throwaway target on this runner: a local registry,
  # an sshd and a compose project. Proves: the running digest equals the deployed
  # digest, a promote and a rollback swap it, and a wrong or missing digest fails.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the throwaway target
        run: tests/deploy/setup-target.sh

      - name: Deploy A
        uses: $/actions/deploy
        with:
          image: ${{ env.SELFTEST_IMAGE }}
          service: app
          compose-dir: ${{ env.SELFTEST_DIR }}
          host: 127.0.0.1
          port: "2222"
          user: ${{ env.SELFTEST_USER }}
          ssh-key: ${{ env.SELFTEST_KEY }}
          known-hosts: ${{ env.SELFTEST_KNOWN_HOSTS }}
          wait-timeout: "60"
          digest: ${{ env.SELFTEST_DIGEST_A }}
      - name: A runs (checked outside the action)
        env:
          WANT: ${{ env.SELFTEST_IMAGE }}@${{ env.SELFTEST_DIGEST_A }}
        run: tests/deploy/assert-running.sh "$WANT"

      - name: Verify with the wrong digest (must fail)
        id: wrong
        continue-on-error: true
        uses: $/actions/deploy
        with:
          image: ${{ env.SELFTEST_IMAGE }}
          service: app
          compose-dir: ${{ env.SELFTEST_DIR }}
          host: 127.0.0.1
          port: "2222"
          user: ${{ env.SELFTEST_USER }}
          ssh-key: ${{ env.SELFTEST_KEY }}
          known-hosts: ${{ env.SELFTEST_KNOWN_HOSTS }}
          wait-timeout: "60"
          digest: ${{ env.SELFTEST_DIGEST_B }}
          verify-only: "true"

      - name: Deploy a digest that does not exist (must fail)
        id: missing
        continue-on-error: true
        uses: $/actions/deploy
        with:
          image: ${{ env.SELFTEST_IMAGE }}
          service: app
          compose-dir: ${{ env.SELFTEST_DIR }}
          host: 127.0.0.1
          port: "2222"
          user: ${{ env.SELFTEST_USER }}
          ssh-key: ${{ env.SELFTEST_KEY }}
          known-hosts: ${{ env.SELFTEST_KNOWN_HOSTS }}
          wait-timeout: "60"
          digest: ${{ env.SELFTEST_MISSING }}

      - name: Promote to B
        uses: $/actions/deploy
        with:
          image: ${{ env.SELFTEST_IMAGE }}
          service: app
          compose-dir: ${{ env.SELFTEST_DIR }}
          host: 127.0.0.1
          port: "2222"
          user: ${{ env.SELFTEST_USER }}
          ssh-key: ${{ env.SELFTEST_KEY }}
          known-hosts: ${{ env.SELFTEST_KNOWN_HOSTS }}
          wait-timeout: "60"
          digest: ${{ env.SELFTEST_DIGEST_B }}
      - name: B runs
        env:
          WANT: ${{ env.SELFTEST_IMAGE }}@${{ env.SELFTEST_DIGEST_B }}
        run: tests/deploy/assert-running.sh "$WANT"

      - name: Roll back to A (by digest, no build)
        uses: $/actions/deploy
        with:
          image: ${{ env.SELFTEST_IMAGE }}
          service: app
          compose-dir: ${{ env.SELFTEST_DIR }}
          host: 127.0.0.1
          port: "2222"
          user: ${{ env.SELFTEST_USER }}
          ssh-key: ${{ env.SELFTEST_KEY }}
          known-hosts: ${{ env.SELFTEST_KNOWN_HOSTS }}
          wait-timeout: "60"
          digest: ${{ env.SELFTEST_DIGEST_A }}
      - name: A runs again
        env:
          WANT: ${{ env.SELFTEST_IMAGE }}@${{ env.SELFTEST_DIGEST_A }}
        run: tests/deploy/assert-running.sh "$WANT"

      - name: The failure cases failed
        env:
          WRONG: ${{ steps.wrong.outcome }}
          MISSING: ${{ steps.missing.outcome }}
        run: |
          echo "wrong digest: $WRONG, missing digest: $MISSING"
          [[ "$WRONG" == "failure" && "$MISSING" == "failure" ]]
      - name: sshd log
        if: failure()
        run: sudo cat "$RUNNER_TEMP/deploy-selftest/sshd.log" || true
