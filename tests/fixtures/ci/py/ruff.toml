# Ruff config for synthwerk-* Python repos.
# Copy to the repo root as ruff.toml. Source: synthwerk-blueprint/configs/python.
line-length = 100
target-version = "py314"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT", "TID"]

[lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
