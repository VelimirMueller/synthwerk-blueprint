# zizmor policy: third-party actions must be pinned by commit SHA.
# First-party refs use a tag: the blueprint the moving major (spec Q-B1: @v1),
# fleet-workflows its release tag (fleet CI-STAGE-04).
rules:
  unpinned-uses:
    config:
      policies:
        "VelimirMueller/synthwerk-blueprint/*": ref-pin
        "VelimirMueller/fleet-workflows/*": ref-pin
        "*": hash-pin
